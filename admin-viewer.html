<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapTest Data Viewer</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#14181f;--mu:#667085;--bd:#dfe3ea;--ac:#0b6e4f;--acx:#fff;--dg:#b42318;--cd:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--sf:#171c23;--tx:#e8ecf1;--mu:#8b95a5;--bd:#2a323d;--ac:#3ddc97;--acx:#06281a;--dg:#ff7b72;--cd:#1f262f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.mono,pre,textarea,code{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;font-weight:650}
header .sp{flex:1}
#who{color:var(--mu);font-size:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--dg)}
input,select,textarea{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:7px 9px;border-radius:6px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
#login{max-width:420px;margin:7vh auto;padding:0 16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1}
.tabs button.on{background:var(--cd);border-color:var(--ac)}
#app{display:none;grid-template-columns:230px 1fr;min-height:calc(100vh - 49px)}
aside{border-right:1px solid var(--bd);background:var(--sf);padding:12px;overflow:auto}
aside .item{display:flex;justify-content:space-between;padding:7px 9px;border-radius:6px;cursor:pointer;word-break:break-all}
aside .item:hover{background:var(--cd)}
aside .item.on{background:var(--cd);font-weight:650;box-shadow:inset 3px 0 var(--ac)}
aside .item i{font-style:normal;color:var(--mu);font-size:11px}
main{padding:14px 16px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar input{flex:1;min-width:140px;width:auto}
.bar .w{flex:0 0 220px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--cd);position:sticky;top:0}
tr.r{cursor:pointer}tr.r:hover td{background:var(--cd)}
td.id{white-space:nowrap;font-size:12px}
td.pv{color:var(--mu);font-size:12px;max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{padding:10px 12px;border-radius:6px;margin:8px 0;background:var(--cd)}
.msg.e{color:var(--dg);border:1px solid var(--dg);background:transparent}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--mu)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;align-items:center;justify-content:center;padding:16px}
#ov .card{width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column}
#ov textarea{flex:1;min-height:340px;resize:vertical;font-size:12.5px;tab-size:2}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.row .sp{flex:1}
.meta{color:var(--mu);font-size:12px}
@media(max-width:720px){#app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--bd);max-height:190px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>SnapTest Data Viewer</h1><span id="who"></span><span class="sp"></span>
  <button id="bStats" style="display:none">Stats</button>
  <button id="bOut" style="display:none">Logout</button>
</header>

<section id="login">
  <div class="card">
    <label style="margin-top:0">Backend URL</label>
    <input id="url" placeholder="https://snaptestpro-backend.onrender.com">
    <div class="tabs" style="margin-top:14px">
      <button id="t1" class="on">Backend login</button><button id="t2">Firebase token</button>
    </div>
    <div id="p1">
      <label>Email (ADMIN_EMAILS wali)</label><input id="em" type="email" autocomplete="username">
      <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    </div>
    <div id="p2" style="display:none">
      <label>Firebase ID token</label>
      <textarea id="tk" rows="4" class="mono" placeholder="Admin app me login karke Console me chalao: await firebase.auth().currentUser.getIdToken()"></textarea>
      <div class="meta" style="margin-top:6px">Token ~1 ghante me expire hota hai.</div>
    </div>
    <div id="lerr"></div>
    <div class="row"><button id="go" class="p" style="width:100%">Connect</button></div>
  </div>
</section>

<div id="app">
  <aside>
    <div class="meta" style="margin-bottom:6px">Collections</div>
    <div id="cols"></div>
    <label>Aur collection kholo</label>
    <input id="newc" placeholder="naam likho, Enter">
  </aside>
  <main>
    <div id="st"></div>
    <div id="empty" class="msg">Left se collection chuno.</div>
    <div id="view" style="display:none">
      <div class="bar">
        <b id="ctitle" style="align-self:center"></b>
        <input id="q" placeholder="Loaded docs me search...">
        <input id="wh" class="w mono" placeholder="field:op:value  (eg. subject:eq:&quot;Physics&quot;)">
        <button id="bLoad">Load</button><button id="bNew" class="p">+ Naya doc</button>
      </div>
      <div id="err"></div>
      <div class="tw"><table><thead><tr><th>Doc ID</th><th>Data</th><th>Updated</th></tr></thead><tbody id="tb"></tbody></table></div>
      <div class="row"><span class="meta" id="cnt"></span><span class="sp"></span>
        <button id="bPrev">&larr; Pehle</button><button id="bNext">Agle &rarr;</button></div>
    </div>
  </main>
</div>

<div id="ov"><div class="card">
  <div class="row" style="margin-top:0"><b id="ot"></b><span class="sp"></span><button id="oc">Band</button></div>
  <label>Doc ID</label><input id="oid" class="mono">
  <label>Data (JSON)</label><textarea id="ob" class="mono" spellcheck="false"></textarea>
  <div id="oerr"></div>
  <div class="meta" id="om" style="margin-top:6px"></div>
  <div class="row"><button id="od" class="d">Delete</button><span class="sp"></span><button id="os" class="p">Save</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id), LIM=50;
const PRESET=["questionBank","deletedQuestions","seedExclusions","draftQuestions","pdfDrafts"];
let S={url:"",token:"",own:false,col:null,off:0,docs:[],cur:null,mode:"own"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:k=>{try{return sessionStorage.getItem(k)||""}catch{return""}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}}};
const showErr=(id,m)=>{$(id).innerHTML=m?'<div class="msg e">'+esc(m)+'</div>':""};

async function api(path,opt={}){
  const r=await fetch(S.url+path,{...opt,headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})}});
  let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function setMode(m){S.mode=m;$("t1").classList.toggle("on",m==="own");$("t2").classList.toggle("on",m==="fb");$("p1").style.display=m==="own"?"":"none";$("p2").style.display=m==="fb"?"":"none"}
$("t1").onclick=()=>setMode("own");$("t2").onclick=()=>setMode("fb");

async function connect(){
  showErr("lerr","");
  S.url=$("url").value.trim().replace(/\/+$/,"");
  if(!/^https?:\/\//.test(S.url))return showErr("lerr","Backend URL https:// se shuru hona chahiye");
  $("go").disabled=true;$("go").textContent="Connecting... (server so raha ho to 30-50 sec lag sakte hain)";
  try{
    if(S.mode==="own"){
      const j=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("em").value,password:$("pw").value})});
      S.token=j.token;S.own=true;
    }else{S.token=$("tk").value.trim();S.own=false;if(!S.token)throw new Error("Token paste karo")}
    const w=await api("/api/auth/whoami");
    if(!w.signedIn)throw new Error("Token valid nahi hai");
    if(w.role!=="admin"&&w.role!=="owner")throw new Error("Ye account admin nahi hai (role: "+w.role+")");
    store.set("url",S.url);store.set("tok",S.token);store.set("own",S.own?"1":"");store.set("who",(w.email||w.uid)+" - "+w.role);
    enter(w);
  }catch(e){showErr("lerr",e.message==="Failed to fetch"?"Backend se connect nahi hua. URL check karo ya CORS_ORIGINS me is page ka origin jodo.":e.message)}
  $("go").disabled=false;$("go").textContent="Connect";
}
$("go").onclick=connect;

function enter(w){
  $("login").style.display="none";$("app").style.display="grid";
  $("who").textContent=(w&&(w.email||w.uid)?(w.email||w.uid)+" - "+w.role:store.get("who"));
  $("bOut").style.display="";$("bStats").style.display=S.own?"":"none";
  renderCols();
}
function logout(){["url","tok","own","who"].forEach(k=>store.set(k,""));location.reload()}
$("bOut").onclick=logout;

function cols(){const x=JSON.parse(store.get("cols")||"[]");return [...new Set([...PRESET,...x])]}
function renderCols(){
  $("cols").innerHTML=cols().map(c=>`<div class="item ${c===S.col?"on":""}" data-c="${esc(c)}">${esc(c)}</div>`).join("");
  $("cols").querySelectorAll(".item").forEach(e=>e.onclick=()=>openCol(e.dataset.c));
}
$("newc").onkeydown=e=>{if(e.key!=="Enter")return;const v=e.target.value.trim();if(!/^[A-Za-z0-9_-]{1,64}$/.test(v))return showErr("err","Collection naam sirf letters, numbers, _ aur - ");
  const x=JSON.parse(store.get("cols")||"[]");x.push(v);store.set("cols",JSON.stringify(x));e.target.value="";openCol(v)};

function openCol(c){S.col=c;S.off=0;$("q").value="";$("wh").value="";$("empty").style.display="none";$("view").style.display="";$("ctitle").textContent=c;renderCols();load()}
async function load(){
  showErr("err","");$("tb").innerHTML='<tr><td colspan="3" class="meta">Load ho raha hai...</td></tr>';
  try{
    let p=`/api/collections/${encodeURIComponent(S.col)}/documents?limit=${LIM}&offset=${S.off}`;
    const w=$("wh").value.trim();if(w)p+="&where="+encodeURIComponent(w);
    const j=await api(p);S.docs=j.docs;draw();
  }catch(e){S.docs=[];draw();showErr("err",e.message)}
}
function pv(d){return JSON.stringify(d,(k,v)=>v&&typeof v==="object"&&"__ts" in v?new Date(v.__ts).toISOString():v)}
function draw(){
  const q=$("q").value.toLowerCase();
  const rows=S.docs.map((d,i)=>({d,i,t:pv(d.data)})).filter(x=>!q||x.d.id.toLowerCase().includes(q)||x.t.toLowerCase().includes(q));
  $("tb").innerHTML=rows.length?rows.map(x=>`<tr class="r" data-i="${x.i}"><td class="id mono">${esc(x.d.id)}</td><td class="pv mono">${esc(x.t.slice(0,300))}</td><td class="meta" style="white-space:nowrap">${esc(new Date(x.d.updatedAt).toLocaleString())}</td></tr>`).join(""):'<tr><td colspan="3" class="meta">Koi document nahi mila.</td></tr>';
  $("tb").querySelectorAll("tr.r").forEach(e=>e.onclick=()=>edit(S.docs[+e.dataset.i]));
  $("cnt").textContent=`Ye page: ${S.docs.length} docs (${S.off+1}-${S.off+S.docs.length})`;
  $("bPrev").disabled=S.off===0;$("bNext").disabled=S.docs.length<LIM;
}
$("q").oninput=draw;$("bLoad").onclick=()=>{S.off=0;load()};
$("wh").onkeydown=e=>{if(e.key==="Enter"){S.off=0;load()}};
$("bPrev").onclick=()=>{S.off=Math.max(0,S.off-LIM);load()};
$("bNext").onclick=()=>{S.off+=LIM;load()};

function edit(d){
  S.cur=d;showErr("oerr","");$("ov").style.display="flex";
  $("ot").textContent=d?"Document edit":"Naya document";
  $("oid").value=d?d.id:"";$("oid").readOnly=!!d;
  $("ob").value=JSON.stringify(d?d.data:{},null,2);
  $("od").style.display=d?"":"none";
  $("om").textContent=d?"Created: "+new Date(d.createdAt).toLocaleString():"ID khali chhodo to random ID banegi.";
}
$("bNew").onclick=()=>edit(null);$("oc").onclick=()=>$("ov").style.display="none";
$("os").onclick=async()=>{
  let data;try{data=JSON.parse($("ob").value)}catch(e){return showErr("oerr","JSON galat hai: "+e.message)}
  try{
    const id=$("oid").value.trim();
    await api(`/api/collections/${encodeURIComponent(S.col)}/documents`,{method:"POST",body:JSON.stringify({docId:id||undefined,data})});
    $("ov").style.display="none";load();
  }catch(e){showErr("oerr",e.message)}
};
$("od").onclick=async()=>{
  if(!confirm(`"${S.cur.id}" delete karna hai? Ye wapas nahi aayega.`))return;
  try{await api(`/api/collections/${encodeURIComponent(S.col)}/documents/${encodeURIComponent(S.cur.id)}`,{method:"DELETE"});$("ov").style.display="none";load()}
  catch(e){showErr("oerr",e.message)}
};
$("bStats").onclick=async()=>{
  try{const s=(await api("/api/stats")).stats;
    $("st").innerHTML=`<div class="stats"><div><b>${s.users}</b><span>Users</span></div><div><b>${s.documents}</b><span>Documents</span></div><div><b>${s.files}</b><span>Files</span></div><div><b>${s.dbSizeMB} MB</b><span>DB size</span></div></div>`}
  catch(e){$("st").innerHTML='<div class="msg e">'+esc(e.message)+"</div>"}
};

// pichla session wapas
(async()=>{
  $("url").value=store.get("url")||"";
  if(store.get("url")&&store.get("tok")){
    S.url=store.get("url");S.token=store.get("tok");S.own=!!store.get("own");
    try{const w=await api("/api/auth/whoami");if(w.signedIn&&(w.role==="admin"||w.role==="owner"))return enter(w)}catch{}
  }
})();
</script>
</body>
</html>
