name: Build Institute APK

# Ek institute ka APK (alag naam, logo, package) banata hai — poora code wahi, repo wahi.
# GitHub > Actions > "Build Institute APK" > Run workflow > institute_id daalo (Owner Panel > institute > "📱 APK" me milti hai).
# NOTE: ye workflow app-version.json ko TOUCH NAHI karta, isliye main app ke users ko galat APK update nahi jata.
on:
  workflow_dispatch:
    inputs:
      institute_id:
        description: "Institute ID (Owner Panel > institute card > 📱 APK me dikhti hai)"
        type: string
        required: true
      app_name:
        description: "App ka naam (khaali = institute ka naam apne-aap)"
        type: string
        default: ""
      live_mode:
        description: "Live mode? (haan = website update hote hi sab institute APK me update; nahi = bundled copy)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  institute-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INSTITUTE_ID: ${{ inputs.institute_id }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Institute ki details (naam, logo) Firestore se
        id: inst
        run: node scripts/fetch-institute.js

      - name: Config set karo (package, naam, live URL, icon)
        env:
          LIVE: ${{ inputs.live_mode }}
          BASE_URL: ${{ vars.APP_URL || 'https://snaptestpro.github.io/' }}
        run: |
          echo "APP_ID=${{ steps.inst.outputs.package }}" >> "$GITHUB_ENV"
          echo "APP_NAME=${{ steps.inst.outputs.app_name }}" >> "$GITHUB_ENV"
          if [ "$LIVE" = "true" ]; then
            case "$BASE_URL" in *\?*) SEP="&";; *) SEP="?";; esac
            echo "APP_URL=${BASE_URL}${SEP}inst=${INSTITUTE_ID}" >> "$GITHUB_ENV"
          fi
          if [ "${{ steps.inst.outputs.has_icon }}" = "true" ]; then echo "ICON_FILE=$GITHUB_WORKSPACE/institute-icon.img" >> "$GITHUB_ENV"; fi
          if [ "${{ steps.inst.outputs.active }}" = "false" ]; then echo "::warning::Ye institute abhi Owner Panel me DEACTIVE hai — APK banega par app 'band hai' screen dikhayegi jab tak activate na ho."; fi

      - name: Web files -> www/ (institute lock ke saath)
        run: node scripts/build-www.js

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Firebase google-services.json (push ke liye)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            node scripts/patch-google-services.js
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret nahi mila — app banegi, par push band rahegi."
          fi

      - name: Keystore (agar secrets set hain)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Keystore secret nahi mila — sirf debug APK banega (ise baad me update nahi kar sakte)."
          fi

      - name: Permissions, icon, version
        run: node scripts/android-prepare.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          SLUG="${{ steps.inst.outputs.slug }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${SLUG}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/${SLUG}.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.inst.outputs.slug }}
          path: out/*
          retention-days: 30

      - name: Signed APK ko GitHub Release me daalo (seedha download link)
        if: steps.ks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ steps.inst.outputs.slug }}"
          TAG="inst-${SLUG}-b${{ github.run_number }}"
          gh release create "$TAG" "out/${SLUG}.apk" --title "${APP_NAME} (${VERSION_NAME})" \
            --notes "Institute APK: ${APP_NAME} | package ${APP_ID} | institute id ${INSTITUTE_ID}" --target "${{ github.sha }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${SLUG}.apk"
          {
            echo "### ✅ ${APP_NAME} ka APK tayyar"
            echo "Download: ${URL}"
            echo ""
            echo "- Package: \`${APP_ID}\`"
            echo "- Mode: $([ -n "$APP_URL" ] && echo 'Live (website update = app update)' || echo 'Bundled')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (debug APK)
        if: steps.ks.outputs.signed != 'true'
        run: |
          {
            echo "### ⚠️ ${APP_NAME}: sirf debug APK bana (keystore secret nahi mila)"
            echo "Neeche Artifacts me \`apk-${{ steps.inst.outputs.slug }}\` se download karein."
          } >> "$GITHUB_STEP_SUMMARY"
