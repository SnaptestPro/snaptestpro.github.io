name: Apply Exchange
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -e
          test -f SnapTestPro_GitHub_Exchange.zip
          mkdir -p /tmp/ex
          unzip -q SnapTestPro_GitHub_Exchange.zip -d /tmp/ex
          EX=/tmp/ex/SnapTestPro_GitHub_Exchange
          git config user.name "exchange-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B fix/phases-6-10
          cp "$EX/02_UPLOAD/part1/.github/workflows/ci.yml" CI_YML_PASTE_ME.txt
          rm -f "$EX/02_UPLOAD/part1/.github/workflows/ci.yml"
          while IFS= read -r p || [ -n "$p" ]; do p="${p%$'\r'}"; [ -z "$p" ] && continue; git rm -q -f --ignore-unmatch -- "$p"; done < "$EX/03_AUTO_SCRIPTS/delete_paths.txt"
          for part in "$EX"/02_UPLOAD/part*; do cp -R "$part"/. .; done
          git rm -q -f SnapTestPro_GitHub_Exchange.zip
          git add -A
          git commit -m "Phase 6-10 update (exchange)"
          git push -f origin fix/phases-6-10
