name: Build Owner APK

# Sirf OWNER ka APK: khulte hi seedha Owner Panel, ek baar login (persistent), Student/Admin ka koi code nahi.
# GitHub > Actions > "Build Owner APK" > Run workflow.
# NOTE: ye workflow app-version.json ko TOUCH NAHI karta (main app ke users ko galat APK update nahi jata).
run-name: Owner APK
on:
  workflow_dispatch:
    inputs:
      live_mode:
        description: "Live mode? (haan = website update hote hi Owner app bhi update; nahi = bundled copy)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  owner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ID: com.snaptestpro.owner
      APP_NAME: SnapTest Owner
      OWNER_APP: "1"
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Config (live URL + owner icon)
        env:
          LIVE: ${{ inputs.live_mode }}
          BASE_URL: ${{ vars.APP_URL || 'https://snaptestpro.github.io/' }}
        run: |
          echo "ICON_FILE=$GITHUB_WORKSPACE/icon-512-maskable-owner.png" >> "$GITHUB_ENV"
          if [ "$LIVE" = "true" ]; then
            B="${BASE_URL%%\?*}"; B="${B%/}"
            echo "APP_URL=${B}/owner-app.html" >> "$GITHUB_ENV"
          fi

      - name: Owner files -> www/
        run: node scripts/build-www.js

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Firebase google-services.json (push ke liye)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            node scripts/patch-google-services.js
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret nahi mila — app banegi, par push band rahegi."
          fi

      - name: Keystore (agar secrets set hain)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Keystore secret nahi mila — sirf debug APK banega (ise baad me update nahi kar sakte)."
          fi

      - name: Permissions, icon, version
        run: node scripts/android-prepare.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/snaptest-owner-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/snaptest-owner.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-owner
          path: out/*
          retention-days: 30

      - name: Signed APK -> GitHub Release
        if: steps.ks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="owner-b${{ github.run_number }}"
          gh release create "$TAG" out/snaptest-owner.apk --title "SnapTest Owner (${VERSION_NAME})" \
            --notes "Owner-only APK | package ${APP_ID}" --target "${{ github.sha }}"
          {
            echo "### ✅ SnapTest Owner APK tayyar"
            echo "Download: https://github.com/${{ github.repository }}/releases/download/${TAG}/snaptest-owner.apk"
            echo ""
            echo "- Package: \`${APP_ID}\`"
            echo "- Mode: $([ -n "$APP_URL" ] && echo 'Live (website update = app update)' || echo 'Bundled')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (debug APK)
        if: steps.ks.outputs.signed != 'true'
        run: |
          echo "### ⚠️ Sirf debug APK bana (keystore secret nahi mila). Artifacts me \`apk-owner\` se download karein." >> "$GITHUB_STEP_SUMMARY"
