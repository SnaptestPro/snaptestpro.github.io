# Owner ka alag app (com.snaptestpro.owner). Sirf Owner Panel ki files (OWNER_APP=1).
# Chalane ke liye: Actions -> "Build Owner APK" -> Run workflow.
name: Build Owner APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OWNER_APP: "1"
      APP_ID: com.snaptestpro.owner
      APP_NAME: SnapTest Owner
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencies
        run: npm install --no-audit --no-fund

      - name: Owner app ke web files
        run: node scripts/build-www.js

      - name: Android project banao
        run: npx cap add android

      - name: Firebase (push) config
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            node scripts/patch-google-services.js
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret nahi hai — push ke bina build hoga"
          fi

      - name: Version + icon + signing
        id: ver
        run: |
          VC=$(( $(date +%s) / 60 ))
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          export VERSION_CODE=$VC VERSION_NAME="1.0.$VC"
          cp icon-512-maskable-owner.png icon-512-maskable.png
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          fi
          node scripts/android-prepare.js

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: APK dhundo
        id: apk
        run: |
          F=$(find android/app/build/outputs/apk -name '*.apk' | grep -v unaligned | head -n1)
          [ -n "$F" ] || { echo "APK nahi bana"; exit 1; }
          cp "$F" SnapTestOwner.apk
          echo "file=SnapTestOwner.apk" >> "$GITHUB_OUTPUT"

      - name: Release me daalo (signed APK ho tabhi)
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "owner-b${{ steps.ver.outputs.code }}" SnapTestOwner.apk \
            --title "SnapTest Owner (b${{ steps.ver.outputs.code }})" \
            --notes "Owner app" --latest=false

      - name: APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: owner-apk
          path: SnapTestOwner.apk
          retention-days: 14
