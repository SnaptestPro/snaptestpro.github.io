name: Auto Extract Zip

# Repo ke root me koi *.zip upload karo -> ye khud extract karke files adjust kar deta hai.
# .github/workflows wali files bhi tabhi jaati hain jab repo secret WORKFLOW_PAT set ho
# (GitHub ka default token workflow files push nahi kar sakta). PAT nahi hai to pehle jaisa:
# .github zip se hata diya jaata hai, baaki sab normal extract hota hai.

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - name: Extract all zip files
        run: |
          shopt -s nullglob dotglob
          found=0
          for z in *.zip; do
            found=1
            rm -rf /tmp/x && mkdir /tmp/x
            unzip -q -o "$z" -d /tmp/x
            rm -rf /tmp/x/__MACOSX

            items=(/tmp/x/*)
            if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
              src="${items[0]}"
            else
              src=/tmp/x
            fi

            rm -rf "$src/.git"
            if [ "$HAS_PAT" != "true" ]; then rm -rf "$src/.github"; fi
            cp -a "$src"/. .
            rm -f "$z"
          done

          if [ "$found" -eq 1 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -A
            git commit -m "Auto extract zip" || echo "No changes"
            git pull --rebase
            git push
          fi
