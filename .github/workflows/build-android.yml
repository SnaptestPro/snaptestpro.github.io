# Main app (com.snaptestpro.app) ka naya signed APK -> GitHub Release + app-version.json + students/admin ko push.
# Chalane ke liye: Actions -> "Build Android App" -> Run workflow.
name: Build Android App

on:
  workflow_dispatch:
    inputs:
      audience:
        description: "Kise notification bheje"
        required: true
        default: both
        type: choice
        options: [both, admin, student, none]
      notes:
        description: "Kya naya hai (dialog me dikhega)"
        required: false
        default: "App ka naya version aaya hai."
        type: string
      force:
        description: "Zaroori update (Baad mein button hat jaata hai)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: com.snaptestpro.app
      APP_URL: ${{ vars.APP_URL || 'https://snaptestpro.github.io/' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Naya build number (app-version.json + 1)
        id: ver
        run: |
          CUR=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('app-version.json','utf8')).apk.build||0)}catch(e){console.log(0)}")
          echo "code=$(( CUR + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: npm ci --no-audit --no-fund

      - name: Web files
        run: node scripts/build-www.js

      - name: Android project banao
        run: npx cap add android

      - name: Firebase (push) config
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            node scripts/patch-google-services.js
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret nahi hai — push ke bina build hoga"
          fi

      - name: Version + icon + signing
        run: |
          export VERSION_CODE=${{ steps.ver.outputs.code }} VERSION_NAME="1.0.${{ steps.ver.outputs.code }}"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          fi
          node scripts/android-prepare.js

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: APK dhundo
        run: |
          F=$(find android/app/build/outputs/apk -name '*.apk' | grep -v unaligned | head -n1)
          [ -n "$F" ] || { echo "APK nahi bana"; exit 1; }
          cp "$F" SnapTestPro.apk

      - name: APK artifact (backup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snaptestpro-apk
          path: SnapTestPro.apk
          retention-days: 14

      - name: Keystore secrets nahi — publish nahi karenge
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_* secrets set nahi hain. Debug APK sirf artifact me hai; release/app-version.json nahi badla (galat key se update install nahi hota)."

      - name: Release + app-version.json
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.ver.outputs.code }}
          NOTES: ${{ inputs.notes }}
          FORCE: ${{ inputs.force }}
        run: |
          gh release create "app-b$CODE" SnapTestPro.apk --title "SnapTest Pro b$CODE" --notes "$NOTES"
          node -e "
            const fs=require('fs');
            const o={apk:{build:+process.env.CODE,name:'1.0.'+process.env.CODE,
              url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/releases/download/app-b'+process.env.CODE+'/SnapTestPro.apk',
              notes:process.env.NOTES||'App ka naya version aaya hai.',force:process.env.FORCE==='true'}};
            fs.writeFileSync('app-version.json',JSON.stringify(o,null,2)+'\n');"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app-version.json
          git commit -m "APK b$CODE released"
          git pull --rebase
          git push

      - name: Students / admin ko push
        if: env.HAS_KEYSTORE == 'true' && inputs.audience != 'none'
        env:
          SECRET: ${{ secrets.BROADCAST_SECRET }}
          URL: ${{ vars.PUSH_WORKER_URL || 'https://cool-thunder-a280.vishnu1234stm.workers.dev' }}
          AUD: ${{ inputs.audience }}
        run: |
          if [ -z "$SECRET" ]; then echo "BROADCAST_SECRET nahi — push skip"; exit 0; fi
          sleep 90
          curl -fsS -X POST "$URL/broadcast" -H 'Content-Type: text/plain' \
            --data "{\"secret\":\"$SECRET\",\"audience\":\"$AUD\",\"kind\":\"apk\",\"title\":\"Naya APK aaya hai\",\"body\":\"App ka naya version download karein.\"}" || echo "::warning::push nahi gaya"
