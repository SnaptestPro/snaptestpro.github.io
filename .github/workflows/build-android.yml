name: Build Android App

# Web (Firebase Hosting / jo bhi abhi chal raha hai) is workflow se touch nahi hota.
on:
  workflow_dispatch:          # GitHub > Actions > "Build Android App" > Run workflow
    inputs:
      audience:
        description: "Naye APK ka push notification kise bheje?"
        type: choice
        default: both
        options: [both, admin, student, none]
      notes:
        description: "Is APK me kya naya hai (dialog me dikhega)"
        type: string
        default: "App ka naya version aaya hai."
      force:
        description: "Zaroori update? (haan = purane app me 'Baad mein' button nahi)"
        type: boolean
        default: false
  push:
    tags: ['app-v*']          # git tag app-v1.0.0 && git push --tags

permissions:
  contents: write            # APK ko GitHub Release me daalne aur app-version.json commit karne ke liye

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ID: ${{ vars.APP_ID || 'com.snaptestpro.app' }}
      APP_NAME: ${{ vars.APP_NAME || 'SnapTest Pro' }}
      APP_URL: ${{ vars.APP_URL }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Web files -> www/
        run: node scripts/build-www.js

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Firebase google-services.json (push notifications ke liye)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            echo "google-services.json laga diya — push chalu"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret nahi mila — app banegi, par push band rahegi."
          fi

      - name: Keystore (agar secrets set hain)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Keystore secret nahi mila — sirf debug APK banega."
          fi

      - name: Permissions, icon, version
        run: node scripts/android-prepare.js

      - name: Build debug APK (install karke test karne ke liye)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK + AAB (Play Store)
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/SnapTestPro-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/SnapTestPro-release.apk
            cp android/app/build/outputs/bundle/release/app-release.aab out/SnapTestPro-release.aab
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SnapTestPro-android
          path: out/*
          retention-days: 30

      # ───────── AUTO-UPDATE: signed APK -> GitHub Release -> app-version.json -> push notification ─────────
      # Sirf SIGNED (release) APK publish hota hai. Debug APK har build me alag key se sign hota hai, isliye wo purane app par install nahi ho sakta.
      - name: Signed APK ko GitHub Release me publish karo
        id: rel
        if: steps.ks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes || 'App ka naya version aaya hai.' }}
        run: |
          cp out/SnapTestPro-release.apk out/SnapTestPro.apk
          gh release create "app-b${{ github.run_number }}" out/SnapTestPro.apk \
            --title "SnapTest Pro ${VERSION_NAME}" --notes "$NOTES" --target "${{ github.sha }}"
          echo "url=https://github.com/${{ github.repository }}/releases/download/app-b${{ github.run_number }}/SnapTestPro.apk" >> "$GITHUB_OUTPUT"

      - name: app-version.json update (purane app naya APK dekh lenge)
        if: steps.rel.outcome == 'success'
        env:
          APK_URL: ${{ steps.rel.outputs.url }}
          NOTES: ${{ inputs.notes || 'App ka naya version aaya hai.' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          git config user.name "snaptest-bot"
          git config user.email "snaptest-bot@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B main origin/main
          node -e '
            const fs=require("fs"),f="app-version.json";
            let j={}; try{j=JSON.parse(fs.readFileSync(f,"utf8"))}catch(e){}
            j.apk={build:Number(process.env.VERSION_CODE),name:process.env.VERSION_NAME,url:process.env.APK_URL,notes:process.env.NOTES,force:process.env.FORCE==="true"};
            fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n");'
          git add app-version.json
          git commit -m "app-version: build ${VERSION_CODE}" || echo "kuch badla nahi"
          git push origin HEAD:main

      - name: Admin / Student ko push notification (naya APK)
        if: steps.rel.outcome == 'success' && (inputs.audience || 'both') != 'none'
        env:
          WORKER: ${{ vars.PUSH_WORKER_URL || 'https://cool-thunder-a280.vishnu1234stm.workers.dev' }}
          SECRET: ${{ secrets.BROADCAST_SECRET }}
          AUDIENCE: ${{ inputs.audience || 'both' }}
          NOTES: ${{ inputs.notes || 'App ka naya version aaya hai.' }}
        run: |
          if [ -z "$SECRET" ]; then echo "BROADCAST_SECRET secret nahi mila — push nahi gaya (APK update phir bhi app khulne par dikhega)"; exit 0; fi
          sleep 90   # app-version.json GitHub par live ho jaye, phir notification bhejo
          jq -n --arg s "$SECRET" --arg a "$AUDIENCE" --arg b "$NOTES" \
            '{secret:$s,audience:$a,kind:"apk",title:"SnapTest Pro — Naya APK aaya hai",body:$b}' \
            | curl -fsS -X POST "$WORKER/broadcast" -H "Content-Type: text/plain" --data-binary @- || echo "push fail (worker deploy/secret check karein)"
